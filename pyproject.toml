[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorm-monitor"
version = "0.1.0"
description = "授权宿舍 Wi-Fi 与电视联网活动的本地只读监测系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
discovery = ["playwright>=1.49"]
dev = [
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
dorm-monitor = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["artifacts", "private_artifacts"]
